name: Deploy Pages
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble public site
        run: |
          mkdir public
          cp site/index.html site/app.js site/style.css public/
          mkdir -p 'public/村驴' public/base public/reference
          cp '村驴/'*.json 'public/村驴/'
          cp base/*.json public/base/
          cp -R manual public/manual
          cp reference/source_manifest.json public/reference/
      - name: Mirror built Pages site to Cloudflare
        continue-on-error: true
        uses: shandianchengzi/skill/manage-github-pages/cloudflare-backup@4c1bf8604fc78dabb0babc83bfa0e2c1fa645327
        with:
          directory: public
          project: sdz-cook-videos
          site-prefix: cook-videos
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with: {path: public}
      - id: deployment
        uses: actions/deploy-pages@v4
