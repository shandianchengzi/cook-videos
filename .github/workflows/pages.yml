name: Deploy Pages
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble public site
        run: |
          mkdir public
          cp site/index.html site/app.js site/style.css public/
          mkdir -p 'public/村驴' public/base public/reference
          cp '村驴/'*.json 'public/村驴/'
          cp base/*.json public/base/
          cp -R manual public/manual
          cp reference/source_manifest.json public/reference/
      - name: Mirror built Pages site to Cloudflare
        continue-on-error: true
        env:
          MIRROR_DIR: public
          MIRROR_PROJECT: sdz-cook-videos
          MIRROR_PREFIX: cook-videos
          MIRROR_BRANCH: main
          MIRROR_LARGE_POLICY: fail
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/cloudflare-pages-backup.sh
      - uses: actions/upload-pages-artifact@v3
        with: {path: public}
      - id: deployment
        uses: actions/deploy-pages@v4
