name: Update video data
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: Full video recrawl
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: update-video-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: Crawl Bilibili incrementally
        env:
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
        run: python scripts/bilibili.py ${{ inputs.full && '--full' || '' }}
      - run: python scripts/label.py && python scripts/validate.py
      - name: Commit changed data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '村驴/raw.json' '村驴/videos.json'
          git diff --cached --quiet || git commit -m 'data: weekly incremental video update'
          git push

