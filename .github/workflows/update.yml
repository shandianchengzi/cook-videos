name: Update video data
# The narrow push trigger bootstraps and regression-tests crawler changes (labeling v1.3).
on:
  push:
    paths: ['.github/workflows/update.yml']
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: Full video recrawl
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update-video-data
  cancel-in-progress: false
jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: Crawl Bilibili incrementally
        env:
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
        run: python scripts/bilibili.py ${{ inputs.full && '--full' || '' }}
      - run: python scripts/label.py && python scripts/validate.py
      - name: Commit changed data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '村驴/raw.json' '村驴/videos.json' base/dishes.json
          git diff --cached --quiet || git commit -m 'data: weekly incremental video update'
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
      - name: Assemble current data site
        run: |
          mkdir -p public 'public/村驴' public/base public/reference
          cp site/index.html site/app.js site/style.css public/
          cp '村驴/'*.json 'public/村驴/'
          cp base/*.json public/base/
          cp reference/source_manifest.json public/reference/
      - uses: actions/upload-pages-artifact@v3
        with: {path: public}
      - id: deployment
        uses: actions/deploy-pages@v4
