<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>做菜视频索引</title><link rel="stylesheet" href="style.css"></head><body>
<header><p class="eyebrow">COOK VIDEOS · 可追溯数据集</p><h1>做菜视频索引</h1><p>按菜名、食材、标题或简介检索；人工订正优先于自动识别。</p></header>
<main><section class="controls"><input id="q" placeholder="搜索菜名、标题或简介"><select id="dish"><option value="">全部菜名</option></select><select id="ingredient"><option value="">全部食材</option></select><span id="count"></span><button id="pushPending" class="primary">推送暂存（0）</button></section><section id="grid" class="grid"></section></main>
<dialog id="editor"><form method="dialog"><button class="close" value="cancel">×</button><h2>人工订正</h2><p id="editVideo"></p><label>菜名（每行一个）<textarea id="editDishes" rows="4"></textarea></label><label>所选菜名的食材（每行一个）<textarea id="editIngredients" rows="7"></textarea></label><p class="hint">输入内容会自动暂存到当前浏览器，刷新页面也不会丢失。</p><div class="actions"><button value="cancel">取消</button><button id="confirmEdit" type="button" class="primary">确定</button></div><output id="editStatus"></output></form></dialog>
<dialog id="sync"><form method="dialog"><button class="close" value="cancel">×</button><h2>推送全部暂存修改</h2><p id="pendingSummary"></p><label>GitHub Fine-grained Token<input id="token" type="password" autocomplete="off" placeholder="仅保存在当前浏览器"></label><label class="check"><input id="remember" type="checkbox">在 localStorage 保存 Token</label><p class="hint">Token 仅需本仓库 Contents 读写权限。你也可以先下载合并后的 manual JSON。</p><div class="actions"><button id="download" type="button">下载 JSON</button><button id="submit" type="button" class="primary">确认推送全部</button></div><output id="syncStatus"></output></form></dialog>
<footer><a href="村驴/raw.json">原始 JSON</a><a href="村驴/videos.json">标记 JSON</a><a href="base/dishes.json">菜表</a><a href="base/ingredients.json">食材表</a><a href="manual/overrides.json">人工订正</a></footer><script src="app.js"></script></body></html>
